name: Build release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            asset_path: target/release/simprox
            asset_name: simprox-linux-amd64
          - name: windows
            os: windows-latest
            asset_path: target/release/simprox.exe
            asset_name: simprox-windows-amd64.exe
          - name: macos
            os: macos-latest
            asset_path: target/release/simprox
            asset_name: simprox-macos-arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup rust toolchain cache
      uses: Swatinem/rust-cache@v2

    # the toolchain comes from the rust-toolchain file via the preinstalled rustup
    - name: Build
      run: cargo build --release --locked

    - name: Strip release binary (linux and macos)
      if: matrix.name == 'linux' || matrix.name == 'macos'
      run: strip "target/release/simprox"

    - name: Rename binary
      shell: bash
      run: cp "${{ matrix.asset_path }}" "${{ matrix.asset_name }}"

    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.asset_name }}

  release:
    name: Publish github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download binaries
      uses: actions/download-artifact@v8
      with:
        path: binaries
        merge-multiple: true

    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create "${{ github.ref_name }}" binaries/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}"
